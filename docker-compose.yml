version: '3.9'

networks:
  ecommerce-network:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:
  kafka-data:
  zookeeper-data:

services:
  # ===================================
  # INFRASTRUCTURE
  # ===================================
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-sqlserver
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -Q "SELECT 1" -C
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper
    networks:
      - ecommerce-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server kafka:9092
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecommerce-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ===================================
  # BACKEND SERVICES
  # ===================================

  api-gateway:
    build:
      context: ./backend
      dockerfile: src/ApiGateway/ECommerce.ApiGateway/Dockerfile
    container_name: ecommerce-api-gateway
    ports:
      - "5000:8080"
    networks:
      - ecommerce-network
    depends_on:
      - identity-service
      - product-service
      - order-service
    restart: unless-stopped

  identity-service:
    build:
      context: ./backend
      dockerfile: src/Services/Identity/ECommerce.Identity.API/Dockerfile
    container_name: ecommerce-identity-service
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__IdentityDb=Server=sqlserver,1433;Database=ECommerceIdentityDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - Jwt__Key=ECommerceSecretKeyForJwtTokenGenerationMustBe256BitsLongAtLeast
      - Jwt__Issuer=ECommerce.Identity
      - Jwt__Audience=ECommerce.Client
    networks:
      - ecommerce-network
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    build:
      context: ./backend
      dockerfile: src/Services/Product/ECommerce.Product.API/Dockerfile
    container_name: ecommerce-product-service
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__ProductDb=Server=sqlserver,1433;Database=ECommerceProductDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=ECommerceSecretKeyForJwtTokenGenerationMustBe256BitsLongAtLeast
      - Jwt__Issuer=ECommerce.Identity
      - Jwt__Audience=ECommerce.Client
    networks:
      - ecommerce-network
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: ./backend
      dockerfile: src/Services/Order/ECommerce.Order.API/Dockerfile
    container_name: ecommerce-order-service
    ports:
      - "5003:8080"
    environment:
      - ConnectionStrings__OrderDb=Server=sqlserver,1433;Database=ECommerceOrderDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:9092
      - Jwt__Key=ECommerceSecretKeyForJwtTokenGenerationMustBe256BitsLongAtLeast
      - Jwt__Issuer=ECommerce.Identity
      - Jwt__Audience=ECommerce.Client
    networks:
      - ecommerce-network
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  inventory-service:
    build:
      context: ./backend
      dockerfile: src/Services/Inventory/ECommerce.Inventory.API/Dockerfile
    container_name: ecommerce-inventory-service
    ports:
      - "5004:8080"
    environment:
      - ConnectionStrings__InventoryDb=Server=sqlserver,1433;Database=ECommerceInventoryDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:9092
      - Jwt__Key=ECommerceSecretKeyForJwtTokenGenerationMustBe256BitsLongAtLeast
      - Jwt__Issuer=ECommerce.Identity
      - Jwt__Audience=ECommerce.Client
    networks:
      - ecommerce-network
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  review-service:
    build:
      context: ./backend
      dockerfile: src/Services/Review/ECommerce.Review.API/Dockerfile
    container_name: ecommerce-review-service
    ports:
      - "5005:8080"
    environment:
      - ConnectionStrings__ReviewDb=Server=sqlserver,1433;Database=ECommerceReviewDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - Jwt__Key=ECommerceSecretKeyForJwtTokenGenerationMustBe256BitsLongAtLeast
      - Jwt__Issuer=ECommerce.Identity
      - Jwt__Audience=ECommerce.Client
    networks:
      - ecommerce-network
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  shipping-service:
    build:
      context: ./backend
      dockerfile: src/Services/Shipping/ECommerce.Shipping.API/Dockerfile
    container_name: ecommerce-shipping-service
    ports:
      - "5006:8080"
    environment:
      - ConnectionStrings__ShippingDb=Server=sqlserver,1433;Database=ECommerceShippingDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:9092
      - Jwt__Key=ECommerceSecretKeyForJwtTokenGenerationMustBe256BitsLongAtLeast
      - Jwt__Issuer=ECommerce.Identity
      - Jwt__Audience=ECommerce.Client
    networks:
      - ecommerce-network
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend
      dockerfile: src/Services/Notification/ECommerce.Notification.API/Dockerfile
    container_name: ecommerce-notification-service
    ports:
      - "5007:8080"
    environment:
      - Kafka__BootstrapServers=kafka:9092
      - Smtp__Host=smtp.gmail.com
      - Smtp__Port=587
      - Smtp__From=noreply@ecommerce.com
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
    networks:
      - ecommerce-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ===================================
  # FRONTEND
  # ===================================

  frontend:
    build:
      context: ./frontend/ecommerce-web
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    networks:
      - ecommerce-network
    depends_on:
      - api-gateway
    restart: unless-stopped
